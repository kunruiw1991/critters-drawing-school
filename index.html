<!DOCTYPE html>
<html lang="en" data-mode="guided" data-phase="drawing" data-picker="open" data-picker-closable="0">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F8ECD2" />
  <meta name="color-scheme" content="light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Critters Draw" />
  <title>Smiling Critters Drawing School</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 4l5.900 13.200 14.300 1.500-10.700 9.600 3 14.100L24 35.200 11.500 42.400l3-14.100L3.800 18.700l14.300-1.500z' fill='%23FFCB45' stroke='%234A3426' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="src/ui.css" />
</head>
<body>
  <div class="app" id="app">

    <!-- The desk: sketchbook, teacher, crayons -->
    <main class="desk" id="desk">

      <section class="book" aria-label="Sketchbook">
        <nav class="binding" aria-label="Steps">
          <div class="step-trail" id="step-ladder"></div>
        </nav>
        <div class="paper">
          <canvas id="easel-canvas" width="800" height="640" aria-label="Drawing paper"></canvas>
          <button type="button" class="next-step-popup" id="btn-next-step-top" aria-label="Done drawing this step, go to next step">
            <span class="next-step-popup-check" data-ico="check" aria-hidden="true"></span>
            <span class="next-step-popup-label" id="next-step-popup-label">NEXT STEP</span>
            <span class="next-step-popup-arrow" data-ico="next" aria-hidden="true"></span>
          </button>
          <span class="page-star" data-ico="star" aria-hidden="true"></span>
        </div>
      </section>

      <button type="button" class="friend-btn" id="btn-open-picker" aria-label="Choose a friend">
        <span class="friend-face" id="friend-face"></span>
        <span class="friend-swap" data-ico="friends"></span>
      </button>

      <div class="bubble voice-pill" id="voice-subtitle-pill">
        <button type="button" class="voice-btn" id="btn-voice-replay" data-ico="speaker" aria-label="Hear the teacher again"></button>
        <p class="bubble-text" id="voice-subtitle-text">Welcome to Smiling Critters Drawing &amp; Coloring School!</p>
      </div>

      <!-- Mode switch + helper spot: 1-tap Free Color switch alongside magic wand / paint bucket / next friend -->
      <div class="helper">
        <button type="button" class="mode-toggle-btn" id="btn-toggle-freeplay" data-ico="freeplay" aria-label="Free Play Coloring" title="Free Play Coloring"></button>
        <div class="helper-slot">
          <button type="button" class="helper-btn helper-wand" id="btn-auto-step" data-ico="wand" aria-label="Magic helper: draw this step for me"></button>
          <button type="button" class="helper-btn helper-bucket" id="btn-fill-part" data-ico="bucket" aria-label="Paint bucket: fill this part for me"></button>
          <button type="button" class="helper-btn helper-next" id="btn-next-char" aria-label="Next friend">
            <span class="next-face" id="next-face"></span>
            <span data-ico="next"></span>
          </button>
        </div>
      </div>

      <div class="crayons" id="swatch-grid" role="group" aria-label="Crayons"></div>

      <div class="brushes" role="group" aria-label="Brushes">
        <button type="button" class="tool-btn active" data-tool="crayon" id="btn-tool-crayon" data-ico="crayon" aria-label="Crayon"></button>
        <button type="button" class="tool-btn" data-tool="marker" id="btn-tool-marker" data-ico="marker" aria-label="Marker"></button>
        <button type="button" class="tool-btn" data-tool="watercolor" id="btn-tool-watercolor" data-ico="watercolor" aria-label="Watercolor brush"></button>
        <button type="button" class="tool-btn" data-tool="glitter" id="btn-tool-glitter" data-ico="glitter" aria-label="Glitter brush"></button>
      </div>

      <!-- Words for grown-ups and screen readers; the child follows the pictures and the voice -->
      <div class="sr-only" role="status">
        <span id="phase-badge">DRAW STEP 1 OF 6</span>
        <span id="step-title"></span>
        <span id="step-hint"></span>
      </div>
      <span class="sr-only" id="step-meter-label" aria-hidden="true">0% Traced</span>
    </main>

    <!-- Cover page: choose a friend to draw -->
    <section class="picker" id="friend-picker" aria-label="Choose a friend to draw">
      <div class="picker-card">
        <header class="picker-head">
          <h1 class="logo" aria-label="Smiling Critters Drawing School">
            <span class="logo-top" aria-hidden="true">Smiling Critters</span>
            <span class="logo-main" aria-hidden="true">
              <i style="--lc:#FF7F7F;--lr:-5deg">D</i><i style="--lc:#FFCB45;--lr:4deg;--ly:2px">r</i><i style="--lc:#5EC27F;--lr:-3deg">a</i><i style="--lc:#7CC4F5;--lr:5deg;--ly:-2px">w</i><i style="--lc:#B58CF2;--lr:-4deg">i</i><i style="--lc:#FF8FA3;--lr:3deg;--ly:2px">n</i><i style="--lc:#FFA24C;--lr:-5deg">g</i><i class="sp"></i><i style="--lc:#5EC27F;--lr:4deg">S</i><i style="--lc:#7CC4F5;--lr:-4deg;--ly:2px">c</i><i style="--lc:#FF7F7F;--lr:3deg">h</i><i style="--lc:#FFCB45;--lr:-3deg;--ly:-2px">o</i><i style="--lc:#B58CF2;--lr:5deg">o</i><i style="--lc:#FF8FA3;--lr:-4deg">l</i>
            </span>
          </h1>
          <div class="mode-switch" role="group" aria-label="Choose how to play">
            <button type="button" class="mode-btn is-active" id="btn-mode-guided" data-mode="guided" aria-pressed="true" aria-label="Step-by-Step Lesson">
              <span class="mode-btn-ico" data-ico="pencil" aria-hidden="true"></span>
              <span class="mode-btn-label">Step-by-Step</span>
            </button>
            <button type="button" class="mode-btn" id="btn-mode-freeplay" data-mode="freeplay" aria-pressed="false" aria-label="Free Play Coloring">
              <span class="mode-btn-ico" data-ico="palette" aria-hidden="true"></span>
              <span class="mode-btn-label">Free Color</span>
            </button>
          </div>
          <button type="button" class="round-btn" id="btn-cover-voice" data-ico="speaker" aria-label="Hear the teacher"></button>
          <button type="button" class="round-btn" id="btn-close-picker" data-ico="close" aria-label="Back to my drawing"></button>
        </header>
        <div class="friend-grid" id="character-strip"></div>
      </div>
    </section>
  </div>

  <noscript><p style="position:fixed;left:0;right:0;bottom:12px;margin:0;text-align:center;font:700 16px sans-serif;color:#4A3426">Please turn on JavaScript to draw with the Smiling Critters.</p></noscript>
  <script type="module">
    import { initDrawingSchoolApp } from './src/app.js';
    window.addEventListener('DOMContentLoaded', () => {
      initDrawingSchoolApp();
    });
  </script>
</body>
</html>
